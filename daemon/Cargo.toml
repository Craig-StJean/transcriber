[package]
name    = "voice-transcriber-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voice-transcriber-daemon"
path = "src/main.rs"

[dependencies]
# Shared config + DBus constants
common = { path = "../common", package = "voice-transcriber-common" }

# Async runtime
tokio = { workspace = true }

# DBus IPC
zbus = { workspace = true }

# Audio capture (uses ALSA/PipeWire backend automatically on Fedora)
cpal = "0.17"

# HTTP client — pure-Rust TLS, no OpenSSL dependency
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }

# SQLite history — bundled so no system libsqlite3 required
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization (for API response parsing)
serde      = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# XDG dirs (data dir for history.db)
dirs = { workspace = true }

# WebSocket client — pure-Rust TLS, no OpenSSL dependency
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util      = { version = "0.3", default-features = false, features = ["sink", "std"] }
